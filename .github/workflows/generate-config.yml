name: Generate UptimeFlare Config & Deploy

on:
  workflow_dispatch:
    inputs:
      servers_json:
        description: 'JSON array of active servers with their monitoring config'
        required: true
        type: string

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate uptime.config.ts from server data
        env:
          SERVERS_JSON: ${{ inputs.servers_json }}
        run: |
          cat > /tmp/gen.js << 'ENDSCRIPT'
          const servers = JSON.parse(process.env.SERVERS_JSON);

          const COUNTRY_EMOJI = {
            DE: '🇩🇪', AT: '🇦🇹', RS: '🇷🇸', US: '🇺🇸',
            HK: '🇭🇰', PL: '🇵🇱', FR: '🇫🇷', NL: '🇳🇱',
            GB: '🇬🇧', CH: '🇨🇭', SE: '🇸🇪', FI: '🇫🇮',
            NO: '🇳🇴', DK: '🇩🇰', BE: '🇧🇪', ES: '🇪🇸',
            IT: '🇮🇹', PT: '🇵🇹', SG: '🇸🇬', JP: '🇯🇵',
            CA: '🇨🇦', AU: '🇦🇺', BR: '🇧🇷'
          };

          function getMonitorId(server) {
            const parts = server.name.split('-');
            if (parts.length >= 4) {
              return 'node-' + parts[parts.length-2] + '-' + parts[parts.length-1];
            }
            return 'node-' + server.name.replace(/[^a-z0-9]/g, '-');
          }

          function nodeMonitors(prefix, label, ip, host) {
            return [
              {
                id: prefix + '-doh',
                name: 'DoH (HTTPS)',
                method: 'GET',
                target: 'https://' + host + '/dns-query',
                expectedCodes: [200, 400],
                tooltip: 'DNS-over-HTTPS · ' + label,
                statusPageLink: 'https://pure-dns.org/docs',
              },
              {
                id: prefix + '-dot',
                name: 'DoT (TLS)',
                method: 'TCP_PING',
                target: ip + ':853',
                tooltip: 'DNS-over-TLS · ' + label,
                statusPageLink: 'https://pure-dns.org/docs',
                timeout: 10000,
              },
              {
                id: prefix + '-doq',
                name: 'DoQ (QUIC)',
                method: 'TCP_PING',
                target: ip + ':853',
                tooltip: 'DNS-over-QUIC port 853 · ' + label,
                statusPageLink: 'https://pure-dns.org/docs',
                timeout: 10000,
              },
            ];
          }

          const activeServers = servers.filter(s => s.is_active && !s.maintenance_mode);
          let monitors = [];
          for (const s of activeServers) {
            const emoji = COUNTRY_EMOJI[s.country_code] || '🌐';
            const city = s.city || s.country_code;
            const prefix = getMonitorId(s);
            const host = prefix.replace('node-', '') + '-base.pure-dns.org';
            monitors.push(...nodeMonitors(prefix, city + ', ' + s.country_code, s.ip_address_v4, host));
          }

          monitors.push({
            id: 'api-health',
            name: '⚙️ API',
            method: 'GET',
            target: 'https://pure-dns.org/api/health',
            tooltip: 'PureDNS Central API health endpoint',
            expectedCodes: [200],
            statusPageLink: 'https://pure-dns.org',
          });
          monitors.push({
            id: 'website',
            name: '🌐 Website',
            method: 'GET',
            target: 'https://pure-dns.org',
            tooltip: 'pure-dns.org',
            expectedCodes: [200],
            statusPageLink: 'https://pure-dns.org',
          });

          const maintenances = servers
            .filter(s => s.is_active && s.maintenance_mode)
            .map(s => ({
              monitors: [getMonitorId(s)],
              title: 'Scheduled Maintenance',
              body: s.maintenance_reason || 'Node is under scheduled maintenance.',
              start: Date.now(),
              end: Date.now() + 365 * 24 * 60 * 60 * 1000,
            }));

          const monitorsJson = JSON.stringify(monitors, null, 2);
          const maintenancesJson = JSON.stringify(maintenances, null, 2);

          const groupObj = {};
          for (const s of activeServers) {
            const emoji = COUNTRY_EMOJI[s.country_code] || '🌐';
            const city = s.city || s.country_code;
            const key = emoji + ' ' + city + ' \u2013 ' + s.country_code;
            const prefix = getMonitorId(s);
            groupObj[key] = [prefix + '-doh', prefix + '-dot', prefix + '-doq'];
          }
          groupObj['⚙️ Infrastructure'] = ['api-health', 'website'];
          const groupJson = JSON.stringify(groupObj, null, 2);

          const ts = `import type { MaintenanceConfig, MonitorTarget, PageConfig, WorkerConfig } from './types/config'

/**
 * PureDNS Status Page Configuration
 * Deployed at: https://status.pure-dns.org
 *
 * AUTO-GENERATED — managed by PureDNS Admin Dashboard.
 * Generated: ${new Date().toISOString()}
 */

const pageConfig: PageConfig = {
  title: 'PureDNS Status',
  logo: '/puredns-status-logo.svg',
  customFooter: '<p style="text-align: center; font-size: 12px; margin-top: 10px; color: #888;">PureDNS — Privacy-first DNS. <a href="https://pure-dns.org" target="_blank" style="color: #0099cc;">pure-dns.org</a></p>',
  links: [
    { link: 'https://pure-dns.org', label: 'Website' },
    { link: 'https://pure-dns.org/docs', label: 'Setup Guide' },
  ],
  group: ${groupJson},
}

const workerConfig: WorkerConfig = {
  kvWriteCooldownMinutes: 3,
  notification: {
    timeZone: 'Europe/Vienna',
    gracePeriod: 2,
  },
  monitors: ${monitorsJson} as MonitorTarget[],
}

const maintenances: MaintenanceConfig[] = ${maintenancesJson}

export { maintenances, pageConfig, workerConfig }
`;
          require('fs').writeFileSync('uptime.config.ts', ts);
          console.log('Generated uptime.config.ts with', monitors.length, 'monitors');
          ENDSCRIPT
          node /tmp/gen.js

      - name: Show generated config
        run: cat uptime.config.ts

      - name: Commit updated config
        run: |
          git config user.name "PureDNS Bot"
          git config user.email "automated@pure-dns.org"
          git add uptime.config.ts
          git diff --cached --quiet || git commit -m "chore: auto-sync monitors from PureDNS dashboard [skip ci]"
          git push origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with next-on-pages
        run: npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=uptimeflare --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WRANGLER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: db7e366dc87623232444943b8978e7f9
